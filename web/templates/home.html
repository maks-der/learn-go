{{define "home"}}
{{template "head" .}}
<main id="main" class="wrap">
  <section class="hero">
    <p class="eyebrow">{{.UI.SiteName}}</p>
    <h1>{{.UI.Sections}}</h1>
    <p class="lede">{{.UI.Tagline}}</p>
    <p class="meta">{{len .Sections}} {{.UI.SectionsCount}}</p>
  </section>

  <ol class="toc toc--sections">
    {{range .Sections}}
    <li class="toc__item">
      <a class="toc__link" href="/{{$.Lang}}/{{.Slug}}/">
        <span class="toc__num toc__num--section">{{.Slug}}</span>
        <span class="toc__body">
          <span class="toc__title">{{.Title}}</span>
          {{if .Tagline}}<span class="toc__excerpt">{{.Tagline}}</span>{{end}}
        </span>
        <span class="toc__cta">{{.Count}} {{$.UI.TopicsCount}}</span>
      </a>
    </li>
    {{end}}
  </ol>
</main>
{{template "foot" .}}
{{end}}
